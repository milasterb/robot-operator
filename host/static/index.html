<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot Operator</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3;
  --dim: #8b949e; --allow: #3fb950; --limit: #d29922; --stop: #f85149;
  --accent: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); height: 100vh; display: grid;
  grid-template-columns: 22% 1fr 22%;
  font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
}
.col { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.col + .col { border-left: 1px solid var(--line); }
h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim); padding: 12px 14px; border-bottom: 1px solid var(--line);
  font-weight: 600;
}
#chat, #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
.msg { margin-bottom: 12px; }
.msg .who {
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin-bottom: 2px;
}
.msg.you .who { color: var(--accent); }
.entry {
  font: 12px/1.45 ui-monospace, monospace; padding: 6px 8px; margin-bottom: 6px;
  border-left: 2px solid var(--line); background: #0d111788; word-break: break-word;
}
.entry.ALLOW { border-color: var(--allow); }
.entry.LIMIT { border-color: var(--limit); }
.entry.STOP  { border-color: var(--stop); }
.entry .t { color: var(--dim); }
#input { border-top: 1px solid var(--line); padding: 12px 14px; }
#mic {
  width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
#mic:hover { border-color: var(--accent); }
#mic.on { background: #f8514922; border-color: var(--stop); color: var(--stop); }
#dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
#mic.on #dot { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .2; } }
#text {
  width: 100%; margin-top: 8px; padding: 8px 10px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; color: var(--text);
  font-size: 13px; font-family: inherit;
}
#text:focus { outline: none; border-color: var(--accent); }
#map { flex: 1; width: 100%; min-height: 0; }
#status {
  display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
#status div { flex: 1; padding: 10px 14px; }
#status div + div { border-left: 1px solid var(--line); }
#status .k {
  font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
}
#status .v { font: 15px ui-monospace, monospace; margin-top: 2px; }
#card { padding: 14px; display: none; border-top: 1px solid var(--line); }
#card.show { display: block; }
#card .verdict {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  font-weight: 700; margin-bottom: 6px;
}
#card.limit .verdict { color: var(--limit); }
#card.allow .verdict { color: var(--allow); }
#card .why { color: var(--dim); margin-bottom: 12px; }
#card button {
  padding: 9px 18px; margin-right: 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-size: 13px; font-family: inherit;
}
#card #go { background: var(--allow); border-color: var(--allow); color: #0d1117;
  font-weight: 600; }
#stopbar {
  padding: 10px 14px; border-top: 1px solid var(--line);
}
#stopbar button {
  width: 100%; padding: 11px; border-radius: 6px; cursor: pointer;
  background: #f8514915; border: 1px solid var(--stop); color: var(--stop);
  font-size: 13px; font-weight: 600; font-family: inherit;
}
</style>
</head>
<body>

<div class="col">
  <h2>Conversation</h2>
  <div id="chat"></div>
  <div id="input">
    <button id="mic"><span id="dot"></span><span id="miclabel">Hold to speak</span></button>
    <input id="text" placeholder="or type here…" autocomplete="off">
  </div>
</div>

<div class="col">
  <h2>Map</h2>
  <canvas id="map"></canvas>
  <div id="status">
    <div><div class="k">Battery</div><div class="v" id="volt">—</div></div>
    <div><div class="k">Position</div><div class="v" id="pos">—</div></div>
    <div><div class="k">State</div><div class="v" id="state">—</div></div>
  </div>
  <div id="card">
    <div class="verdict" id="cv"></div>
    <div class="why" id="cw"></div>
    <button id="go">Confirm</button>
    <button id="no">Cancel</button>
  </div>
  <div id="stopbar"><button id="estop">STOP</button></div>
</div>

<div class="col">
  <h2>Safety log</h2>
  <div id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let scene = null, lastStop = null, pendingToken = null;

/* ---------- map ---------- */
const cv = $("map"), cx = cv.getContext("2d");
let T = { s: 60, ox: 0, oy: 0 };

function fit() {
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  if (!scene) return;
  const pts = [...scene.places, scene.robot];
  scene.zones.forEach(z => pts.push(...z.polygon));
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const pad = 1.2;
  const w = Math.max(...xs) - Math.min(...xs) + pad * 2;
  const h = Math.max(...ys) - Math.min(...ys) + pad * 2;
  T.s = Math.min(cv.clientWidth / w, cv.clientHeight / h);
  T.ox = cv.clientWidth / 2 - ((Math.max(...xs) + Math.min(...xs)) / 2) * T.s;
  T.oy = cv.clientHeight / 2 + ((Math.max(...ys) + Math.min(...ys)) / 2) * T.s;
}
const px = p => [T.ox + p.x * T.s, T.oy - p.y * T.s];

function draw() {
  cx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  if (!scene) return;

  cx.strokeStyle = "#ffffff08"; cx.lineWidth = 1;
  for (let x = -6; x <= 8; x++) { const [a] = px({x, y: 0});
    cx.beginPath(); cx.moveTo(a, 0); cx.lineTo(a, cv.clientHeight); cx.stroke(); }
  for (let y = -6; y <= 8; y++) { const [, b] = px({x: 0, y});
    cx.beginPath(); cx.moveTo(0, b); cx.lineTo(cv.clientWidth, b); cx.stroke(); }

  scene.zones.forEach(z => {
    cx.beginPath();
    z.polygon.forEach((p, i) => { const [a, b] = px(p);
      i ? cx.lineTo(a, b) : cx.moveTo(a, b); });
    cx.closePath();
    cx.fillStyle = "#f8514918"; cx.fill();
    cx.strokeStyle = "#f85149"; cx.setLineDash([5, 4]); cx.lineWidth = 1.5;
    cx.stroke(); cx.setLineDash([]);
    const c = z.polygon.reduce((a, p) => ({x: a.x + p.x / z.polygon.length,
      y: a.y + p.y / z.polygon.length}), {x: 0, y: 0});
    const [a, b] = px(c);
    cx.fillStyle = "#f85149"; cx.font = "11px sans-serif"; cx.textAlign = "center";
    cx.fillText(z.name, a, b);
  });

  if (scene.path && scene.path.length > 1) {
    cx.beginPath();
    scene.path.forEach((p, i) => { const [a, b] = px(p);
      i ? cx.lineTo(a, b) : cx.moveTo(a, b); });
    cx.strokeStyle = "#58a6ff"; cx.lineWidth = 2; cx.setLineDash([6, 4]);
    cx.stroke(); cx.setLineDash([]);
  }

  scene.places.forEach(p => {
    const [a, b] = px(p);
    cx.beginPath(); cx.arc(a, b, 4, 0, 7);
    cx.fillStyle = "#8b949e"; cx.fill();
    cx.font = "11px sans-serif"; cx.textAlign = "center";
    cx.fillText(p.name, a, b - 10);
  });

  if (lastStop) {
    const [a, b] = px(lastStop);
    cx.beginPath(); cx.arc(a, b, 16, 0, 7);
    cx.strokeStyle = "#f85149"; cx.lineWidth = 2; cx.stroke();
    cx.beginPath(); cx.moveTo(a - 6, b - 6); cx.lineTo(a + 6, b + 6);
    cx.moveTo(a + 6, b - 6); cx.lineTo(a - 6, b + 6); cx.stroke();
  }

  const r = scene.robot, [a, b] = px(r);
  cx.beginPath(); cx.arc(a, b, 11, 0, 7);
  cx.fillStyle = r.moving ? "#3fb950" : "#58a6ff"; cx.fill();
  cx.beginPath(); cx.moveTo(a, b);
  cx.lineTo(a + Math.cos(-r.yaw) * 20, b + Math.sin(-r.yaw) * 20);
  cx.strokeStyle = cx.fillStyle; cx.lineWidth = 2.5; cx.stroke();
}

async function refresh() {
  try {
    scene = await (await fetch("/api/scene")).json();
    $("volt").textContent = scene.robot.voltage.toFixed(1) + " V";
    $("pos").textContent = scene.robot.x.toFixed(1) + ", " + scene.robot.y.toFixed(1);
    $("state").textContent = !scene.robot.localized ? "lost"
      : scene.robot.moving ? "driving" : "stopped";
    fit(); draw();
  } catch (e) {}
}
addEventListener("resize", () => { fit(); draw(); });
refresh(); setInterval(refresh, 1500);

/* ---------- chat + log ---------- */
function bubble(who, text, you) {
  const d = document.createElement("div");
  d.className = "msg" + (you ? " you" : "");
  d.innerHTML = `<div class="who"></div><div class="body"></div>`;
  d.querySelector(".who").textContent = who;
  d.querySelector(".body").textContent = text;
  $("chat").append(d); $("chat").scrollTop = 1e9;
}
function logline(level, text) {
  const d = document.createElement("div");
  d.className = "entry " + level;
  const t = new Date().toLocaleTimeString("en-GB");
  d.innerHTML = `<span class="t"></span> `;
  d.querySelector(".t").textContent = t;
  d.append(document.createTextNode(text));
  $("log").prepend(d);
}

/* ---------- socket ---------- */
const ws = new WebSocket(`ws://${location.host}/ws`);
function send(t) { bubble("You", t, true); ws.send(t); }

ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.type === "say") { bubble("Robot", m.text); speak(m.text); verdictCard(m.text); }
  if (m.type === "tool_call") logline("", `→ ${m.name} ${JSON.stringify(m.arguments)}`);
  if (m.type === "tool_result") {
    const lvl = /cannot|off limits|too tight|does not know|no longer valid/i.test(m.text)
      ? "STOP" : /half speed|slowly/i.test(m.text) ? "LIMIT" : "ALLOW";
    logline(lvl, m.text);
    const tok = m.text.match(/token ([A-Za-z0-9_-]+)/);
    if (tok) { pendingToken = tok[1]; showCard(m.text); }
    if (lvl === "STOP") markStop(m.text);
    refresh();
  }
  if (m.type === "error") logline("STOP", "host error: " + m.text);
};

function markStop(text) {
  if (!scene) return;
  const hit = scene.places.find(p => text.toLowerCase().includes(p.name.toLowerCase()));
  lastStop = hit || {x: scene.robot.x, y: scene.robot.y};
  draw();
}

/* ---------- confirmation card ---------- */
function showCard(text) {
  const limit = /half speed|slowly/i.test(text);
  $("card").className = "show " + (limit ? "limit" : "allow");
  $("cv").textContent = limit ? "Limit — half speed" : "Allow";
  $("cw").textContent = text.replace(/ Confirm with token.*$/, "");
}
function verdictCard(t) { if (/cannot make that trip/i.test(t)) hideCard(); }
function hideCard() { $("card").className = ""; pendingToken = null; }
$("go").onclick = () => { send("Yes, go ahead."); hideCard(); };
$("no").onclick = () => { send("No, cancel that."); hideCard(); };
$("estop").onclick = () => { send("Stop."); hideCard(); };

/* ---------- speech ---------- */
function speak(t) {
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 1.05;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onend = () => { $("mic").className = ""; $("miclabel").textContent = "Hold to speak"; };
} else {
  $("miclabel").textContent = "No microphone support — type below";
}
$("mic").onclick = () => {
  if (!rec) return;
  if ($("mic").className === "on") { rec.stop(); return; }
  speechSynthesis.cancel();
  rec.start();
  $("mic").className = "on"; $("miclabel").textContent = "Listening…";
};
$("text").onkeydown = e => {
  if (e.key === "Enter" && e.target.value.trim()) {
    send(e.target.value.trim()); e.target.value = "";
  }
};
</script>
</body>
</html>
